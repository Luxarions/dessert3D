<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LXRN Engine - Math Test Runner Dashboard</title>
    <style>
      :root {
        --bg-main: #0b0f19;
        --bg-card: #151d2a;
        --border-color: #263346;
        --text-primary: #f1f5f9;
        --text-muted: #94a3b8;
        --accent-blue: #38bdf8;
        --accent-green: #22c55e;
        --accent-red: #ef4444;
        --accent-purple: #a855f7;
        --badge-pass-bg: rgba(34, 197, 94, 0.12);
        --badge-fail-bg: rgba(239, 68, 68, 0.12);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-main);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 2rem 1.5rem;
        min-height: 100vh;
        line-height: 1.5;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 2rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid var(--border-color);
      }

      .title-group h1 {
        font-size: 1.875rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .title-group p {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-top: 0.25rem;
      }

      .header-badge {
        background: rgba(56, 189, 248, 0.1);
        border: 1px solid rgba(56, 189, 248, 0.3);
        color: var(--accent-blue);
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.8rem;
        font-weight: 600;
      }

      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .metric-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 1.25rem;
        position: relative;
        overflow: hidden;
      }

      .metric-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background: var(--card-accent, var(--border-color));
      }

      .metric-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        margin-bottom: 0.5rem;
      }

      .metric-value {
        font-size: 1.875rem;
        font-weight: 700;
      }

      .metric-sub {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 0.25rem;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        padding: 1rem 1.25rem;
        border-radius: 12px;
      }

      .search-box {
        position: relative;
        flex: 1;
        min-width: 240px;
      }

      .search-input {
        width: 100%;
        background: var(--bg-main);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.5rem 0.85rem;
        color: var(--text-primary);
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.2s;
      }

      .search-input:focus {
        border-color: var(--accent-blue);
      }

      .filter-buttons {
        display: flex;
        gap: 0.5rem;
      }

      .btn-filter {
        background: var(--bg-main);
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 0.4rem 0.85rem;
        border-radius: 6px;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-filter.active, .btn-filter:hover {
        border-color: var(--accent-blue);
        color: var(--accent-blue);
      }

      .btn-run {
        background: var(--accent-blue);
        color: #0b0f19;
        border: none;
        padding: 0.55rem 1.25rem;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: opacity 0.2s;
      }

      .btn-run:hover {
        opacity: 0.9;
      }

      .progress-bar-container {
        width: 100%;
        height: 6px;
        background: var(--bg-card);
        border-radius: 9999px;
        overflow: hidden;
        margin-bottom: 2rem;
        border: 1px solid var(--border-color);
      }

      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: var(--accent-green);
        transition: width 0.3s ease;
      }

      .suite-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 1.25rem;
      }

      .suite-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }

      .suite-card:hover {
        border-color: rgba(56, 189, 248, 0.4);
      }

      .suite-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.85rem;
        padding-bottom: 0.6rem;
        border-bottom: 1px solid var(--border-color);
      }

      .suite-title {
        font-weight: 600;
        font-size: 0.95rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: var(--text-primary);
      }

      .badge {
        font-size: 0.75rem;
        padding: 0.2rem 0.6rem;
        border-radius: 9999px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .badge-pass {
        background: var(--badge-pass-bg);
        color: var(--accent-green);
      }

      .badge-fail {
        background: var(--badge-fail-bg);
        color: var(--accent-red);
      }

      .test-list {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .test-item {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.8rem;
        padding: 0.35rem 0.5rem;
        border-radius: 6px;
        background: var(--bg-main);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .test-name {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        color: #cbd5e1;
      }

      .test-item.pass .icon { color: var(--accent-green); }
      .test-item.fail .icon { color: var(--accent-red); }

      .test-duration {
        font-size: 0.725rem;
        color: var(--text-muted);
      }

      .error-box {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 6px;
        padding: 0.6rem;
        margin-top: 0.5rem;
        font-size: 0.75rem;
        color: #fca5a5;
        white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: 3rem 1rem;
        color: var(--text-muted);
        background: var(--bg-card);
        border: 1px dashed var(--border-color);
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="title-group">
          <h1>
            LXRN Math Test Suite
            <span class="header-badge" id="module-count-badge">-- Modules</span>
          </h1>
          <p>Automated verification dashboard for 3D engine mathematics & geometry library</p>
        </div>
        <button class="btn-run" id="run-btn">
          <span>⚡</span> Rerun Suite
        </button>
      </header>

      <div class="metrics-grid">
        <div class="metric-card" style="--card-accent: var(--accent-blue)">
          <div class="metric-label">Total Suites</div>
          <div class="metric-value" id="total-suites">38</div>
          <div class="metric-sub">100% Modules Covered</div>
        </div>
        <div class="metric-card" style="--card-accent: var(--accent-green)">
          <div class="metric-label">Tests Passed</div>
          <div class="metric-value" style="color: var(--accent-green)" id="total-passed">0</div>
          <div class="metric-sub" id="pass-rate">0% Pass Rate</div>
        </div>
        <div class="metric-card" style="--card-accent: var(--accent-red)">
          <div class="metric-label">Tests Failed</div>
          <div class="metric-value" style="color: var(--accent-red)" id="total-failed">0</div>
          <div class="metric-sub" id="fail-sub">No errors</div>
        </div>
        <div class="metric-card" style="--card-accent: var(--accent-purple)">
          <div class="metric-label">Execution Time</div>
          <div class="metric-value" style="color: var(--accent-purple)" id="total-time">0 ms</div>
          <div class="metric-sub">Performance bench</div>
        </div>
      </div>

      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>

      <div class="controls">
        <div class="search-box">
          <input type="text" id="search-input" class="search-input" placeholder="Search module (e.g., Vec3, Mat4, Spline)..." />
        </div>
        <div class="filter-buttons">
          <button class="btn-filter active" data-filter="all">All</button>
          <button class="btn-filter" data-filter="pass">Passed</button>
          <button class="btn-filter" data-filter="fail">Failed</button>
        </div>
      </div>

      <div class="suite-grid" id="suite-container"></div>
    </div>

    <script type="module">
      import { runAllMathTests } from '/test/runner.js';

      const runBtn = document.getElementById('run-btn');
      const container = document.getElementById('suite-container');
      const searchInput = document.getElementById('search-input');
      const filterBtns = document.querySelectorAll('.btn-filter');
      const progressFill = document.getElementById('progress-fill');

      let currentResults = [];
      let activeFilter = 'all';

      async function executeTests() {
        runBtn.disabled = true;
        runBtn.innerHTML = '<span>⌛</span> Running...';

        const summary = await runAllMathTests();
        currentResults = summary.results;

        const passRate = summary.totalTests > 0 
          ? Math.round((summary.totalPassed / summary.totalTests) * 100) 
          : 0;

        document.getElementById('total-suites').textContent = summary.results.length;
        document.getElementById('module-count-badge').textContent = `${summary.results.length} Modules`;
        document.getElementById('total-passed').textContent = summary.totalPassed;
        document.getElementById('total-failed').textContent = summary.totalFailed;
        document.getElementById('total-time').textContent = `${summary.totalDuration} ms`;
        document.getElementById('pass-rate').textContent = `${passRate}% Pass Rate`;
        document.getElementById('fail-sub').textContent = summary.totalFailed === 0 ? 'All clean' : 'Action needed';

        progressFill.style.width = `${passRate}%`;
        progressFill.style.background = summary.totalFailed === 0 ? 'var(--accent-green)' : 'var(--accent-red)';

        renderSuites();

        runBtn.disabled = false;
        runBtn.innerHTML = '<span>⚡</span> Rerun Suite';
      }

      function renderSuites() {
        container.innerHTML = '';
        const query = searchInput.value.toLowerCase().trim();

        const filtered = currentResults.filter(suite => {
          const matchesSearch = suite.name.toLowerCase().includes(query);
          const isPass = suite.failed === 0;

          if (!matchesSearch) return false;
          if (activeFilter === 'pass') return isPass;
          if (activeFilter === 'fail') return !isPass;
          return true;
        });

        if (filtered.length === 0) {
          container.innerHTML = `<div class="empty-state">No matching test suites found for "${query}"</div>`;
          return;
        }

        filtered.forEach(suite => {
          const card = document.createElement('div');
          card.className = 'suite-card';

          const isPass = suite.failed === 0;
          const badgeClass = isPass ? 'badge-pass' : 'badge-fail';
          const badgeText = isPass ? `${suite.passed} PASSED` : `${suite.failed} FAILED`;

          let testsHtml = suite.tests.map(t => `
            <div class="test-item ${t.status.toLowerCase()}">
              <span class="test-name">
                <span class="icon">${t.status === 'PASSED' ? '✔' : '✖'}</span>
                ${t.name}
              </span>
              <span class="test-duration">${t.duration}ms</span>
            </div>
            ${t.error ? `<div class="error-box">${t.error}</div>` : ''}
          `).join('');

          card.innerHTML = `
            <div class="suite-header">
              <span class="suite-title">src/math/${suite.name}.js</span>
              <span class="badge ${badgeClass}">${badgeText}</span>
            </div>
            <div class="test-list">${testsHtml}</div>
          `;

          container.appendChild(card);
        });
      }

      searchInput.addEventListener('input', renderSuites);

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeFilter = btn.dataset.filter;
          renderSuites();
        });
      });

      runBtn.addEventListener('click', executeTests);
      executeTests();
    </script>
  </body>
</html>
